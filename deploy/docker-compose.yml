# YuAgent缁熶竴Docker Compose閰嶇疆
# 鏀寔閫氳繃鐜鍙橀噺鎺у埗涓嶅悓閮ㄧ讲妯″紡锛歭ocal/production/external

name: yuagent

networks:
  yuagent-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  rabbitmq-data:
    driver: local
  storage-data:
    driver: local
  gateway-logs:
    driver: local

services:
  # PostgreSQL鏁版嵁搴撴湇鍔?
  # 浠呭湪闈瀍xternal妯″紡涓嬪惎鍔?
  postgres:
    image: pgvector/pgvector:pg15
    container_name: yuagent-postgres
    profiles:
      - local
      - production
    environment:
      POSTGRES_DB: ${DB_NAME:-yuagent}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docs/sql/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - yuagent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-yuagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ娑堟伅闃熷垪鏈嶅姟
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: yuagent-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - yuagent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # YuAgent鍚庣鏈嶅姟
  yuagent-backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile${DOCKERFILE_SUFFIX:-}
    container_name: yuagent-backend
    user: "0:0"
    environment:
      # 鏁版嵁搴撻厤缃?
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-yuagent}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      
      # Spring閰嶇疆
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SHOW_SQL: ${SHOW_SQL:-true}
      
      # 榛樿鐢ㄦ埛閰嶇疆
      YUAGENT_ADMIN_EMAIL: ${YUAGENT_ADMIN_EMAIL:-admin@yuagent.ai}
      YUAGENT_ADMIN_PASSWORD: ${YUAGENT_ADMIN_PASSWORD:-admin123}
      YUAGENT_ADMIN_NICKNAME: ${YUAGENT_ADMIN_NICKNAME:-YuAgent管理员}
      YUAGENT_TEST_ENABLED: ${YUAGENT_TEST_ENABLED:-true}
      YUAGENT_TEST_EMAIL: ${YUAGENT_TEST_EMAIL:-test@yuagent.ai}
      YUAGENT_TEST_PASSWORD: ${YUAGENT_TEST_PASSWORD:-test123}
      
      # 娑堟伅闃熷垪閰嶇疆
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      
      # 鏃ュ織閰嶇疆
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-info}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-debug}
      
      # 瀹夊叏閰嶇疆
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_please_change_in_production}
      
      # 楂樺彲鐢ㄧ綉鍏抽厤缃?
      HIGH_AVAILABILITY_ENABLED: ${HIGH_AVAILABILITY_ENABLED:-false}
      HIGH_AVAILABILITY_GATEWAY_URL: ${HIGH_AVAILABILITY_GATEWAY_URL:-http://api-gateway:8080}
      HIGH_AVAILABILITY_API_KEY: ${HIGH_AVAILABILITY_API_KEY:-default-api-key}
      
      # 鏀粯閰嶇疆
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-your_alipay_app_id}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-your_alipay_private_key}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-your_alipay_public_key}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-your_stripe_secret_key}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-your_stripe_publishable_key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-your_stripe_webhook_secret}
      
      # GitHub闆嗘垚閰嶇疆
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-agent-mcp-community}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-lucky-aeon}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-your_github_token}
      
      # 鍏朵粬閰嶇疆
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH:-/app/storage}
      FILE_STORAGE_PLATFORM: ${FILE_STORAGE_PLATFORM:-amazon-s3-1}
      S3_ENABLED: ${S3_ENABLED:-true}
      S3_SECRET_ID: ${S3_SECRET_ID}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_DOMAIN: ${S3_DOMAIN}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_DOMAIN: ${OSS_DOMAIN}
      OSS_URL_PREFIX: ${OSS_URL_PREFIX}
      YUAGENT_CONTAINER_DOCKER_HOST: ${YUAGENT_CONTAINER_DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - storage-data:/app/storage
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${BACKEND_PORT:-8088}:8088"
      - "${DEBUG_PORT:-5005}:5005"  # 璋冭瘯绔彛锛堜粎寮€鍙戠幆澧冿級
    dns:
      - 223.5.5.5
      - 8.8.8.8
    networks:
      - yuagent-network
    depends_on:
      postgres:
        condition: service_healthy
        required: false  # external妯″紡涓嶉渶瑕乸ostgres
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    # 寮€鍙戠幆澧冩殏鏃剁鐢ㄥ仴搴锋鏌ヤ互閬垮厤curl渚濊禆
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:8088/api/health || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s

  # YuAgent鍓嶇鏈嶅姟
  yuagent-frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile${DOCKERFILE_SUFFIX:-}
    container_name: yuagent-frontend
    environment:
      # API閰嶇疆
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8088/api}
      
      # Next.js閰嶇疆
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - yuagent-network
    depends_on:
      - yuagent-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# 寮€鍙戞ā寮忛厤缃紙--profile dev锛?
  # 鏁版嵁搴撶鐞嗗伐鍏凤紙浠呭紑鍙戠幆澧冿級
  adminer:
    image: adminer:4-standalone
    container_name: yuagent-adminer
    profiles:
      - dev
    ports:
      - "8082:8080"
    networks:
      - yuagent-network
    depends_on:
      - postgres
    restart: unless-stopped

  # API Premium Gateway 楂樺彲鐢ㄧ綉鍏虫湇鍔?
  api-gateway:
    build:
      context: ../_tmp/mcp-gateway-src
      dockerfile: Dockerfile
    image: yuagent-mcp-gateway:latest
    container_name: yuagent-api-gateway
    profiles:
      - local
      - production
    ports:
      - "8081:8080"
    volumes:
      - gateway-logs:/app/logs
    networks:
      - yuagent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/services?api_key=123456' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

