oss:
  endpoint: ${OSS_ENDPOINT:${S3_ENDPOINT:}}
  access-key: ${OSS_ACCESS_KEY:${S3_SECRET_ID:}}
  secret-key: ${OSS_SECRET_KEY:${S3_SECRET_KEY:}}
  bucket-name: ${OSS_BUCKET:${S3_BUCKET_NAME:}}
  custom-domain: ${OSS_DOMAIN:${S3_DOMAIN:}}
  url-prefix: ${OSS_URL_PREFIX:${OSS_DOMAIN:${S3_DOMAIN:}}}

server:
  port: ${SERVER_PORT:8088}
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 200
    connection-timeout: 2000000
    max-connections: 10000
    accept-count: 100
    max-swallow-size: ${SERVER_TOMCAT_MAX_SWALLOW_SIZE:100MB}

spring:
  application:
    name: YuAgent
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:100MB}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: 19
        max-concurrency: 19
        prefetch: 1
        acknowledge-mode: auto
        default-requeue-rejected: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000
      direct:
        acknowledge-mode: auto
        default-requeue-rejected: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000
    publisher-returns: true
    publisher-confirm-type: correlated
    connection-timeout: 200000
    cache:
      channel:
        size: 25
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yuagent}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: org.yu.domain
  type-handlers-package: org.yu.infrastructure.converter
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted_at
      logic-delete-value: now()
      logic-not-delete-value: "null"
    banner: false

logging:
  level:
    root: info
    org.yu: debug
  file:
    name: logs/yu-agent.log

mail:
  smtp:
    host: ${MAIL_SMTP_HOST:smtp.qq.com}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}
  verification:
    template: ${MAIL_VERIFICATION_TEMPLATE:鎮ㄧ殑楠岃瘉鐮佹槸:%s锛屾湁鏁堟湡10鍒嗛挓锛岃鍕挎硠闇茬粰浠栦汉銆倉
    subject: ${MAIL_VERIFICATION_SUBJECT:YuAgent - 閭楠岃瘉鐮亇

github:
  target:
    repo-name: ${GITHUB_REPO_NAME:agent-mcp-community}
    username: ${GITHUB_USERNAME:lucky-aeon}
    token: ${GITHUB_TOKEN:your_github_token}

high-availability:
  enabled: ${HIGH_AVAILABILITY_ENABLED:false}
  gateway-url: ${HIGH_AVAILABILITY_GATEWAY_URL:http://localhost:8081}
  api-key: ${HIGH_AVAILABILITY_API_KEY:default-api-key-1234567890}
  connect-timeout: 30000
  read-timeout: 60000

embedding:
  name: OpenAI
  vector-store:
    host: ${VECTOR_DB_HOST:${DB_HOST:localhost}}
    port: ${VECTOR_DB_PORT:${DB_PORT:5432}}
    user: ${VECTOR_DB_USER:${DB_USER:postgres}}
    password: ${VECTOR_DB_PASSWORD:${DB_PASSWORD:postgres}}
    database: ${VECTOR_DB_NAME:${DB_NAME:yuagent}}
    table: ${VECTOR_DB_TABLE:public.vector_store}
    dimension: ${VECTOR_DB_DIMENSION:1024}
    drop-table-first: ${VECTOR_DB_DROP_TABLE_FIRST:false}
    create-table: ${VECTOR_DB_CREATE_TABLE:true}

memory:
  embedding:
    vector-store:
      host: ${VECTOR_DB_HOST:${DB_HOST:localhost}}
      port: ${VECTOR_DB_PORT:${DB_PORT:5432}}
      user: ${VECTOR_DB_USER:${DB_USER:postgres}}
      password: ${VECTOR_DB_PASSWORD:${DB_PASSWORD:postgres}}
      database: ${VECTOR_DB_NAME:${DB_NAME:yuagent}}
      table: ${MEMORY_VECTOR_DB_TABLE:public.memory_vector_store}
      dimension: ${VECTOR_DB_DIMENSION:1024}
      drop-table-first: ${MEMORY_VECTOR_DB_DROP_TABLE_FIRST:false}
      create-table: ${MEMORY_VECTOR_DB_CREATE_TABLE:true}

rerank:
  name: OpenAI
  api-key: ${SILICONFLOW_API_KEY}
  api-url: ${SILICONFLOW_API_URL_RERANK}
  model: ${SILICONFLOW_MODEL_RERANK_MODEL:Pro/BAAI/bge-reranker-v2-m3}
  timeout: ${SILICONFLOW_TIMEOUT:30000}

rag:
  remote-import:
    max-file-size: ${RAG_REMOTE_IMPORT_MAX_FILE_SIZE:104857600}
    connect-timeout: ${RAG_REMOTE_IMPORT_CONNECT_TIMEOUT:10s}
    read-timeout: ${RAG_REMOTE_IMPORT_READ_TIMEOUT:2m}
  pdf:
    ocr-render-dpi: ${RAG_PDF_OCR_RENDER_DPI:132}
    ocr-render-dpi-large: ${RAG_PDF_OCR_RENDER_DPI_LARGE:120}
  markdown:
    segment-split:
      enabled: ${RAG_MARKDOWN_SPLIT_ENABLED:true}
      max-length: ${RAG_MARKDOWN_MAX_LENGTH:1800}
      min-length: ${RAG_MARKDOWN_MIN_LENGTH:200}
      buffer-size: ${RAG_MARKDOWN_BUFFER_SIZE:100}
      enable-overlap: ${RAG_MARKDOWN_ENABLE_OVERLAP:false}
      overlap-size: ${RAG_MARKDOWN_OVERLAP_SIZE:50}
  vector:
    max-length: ${RAG_VECTOR_MAX_LENGTH:1800}
    min-length: ${RAG_VECTOR_MIN_LENGTH:200}
    overlap-size: ${RAG_VECTOR_OVERLAP_SIZE:100}

dromara:
  x-file-storage:
    default-platform: ${FILE_STORAGE_PLATFORM:amazon-s3-1}
    thumbnail-suffix: ".min.jpg"
    amazon-s3:
      - platform: amazon-s3-1
        enable-storage: true
        access-key: ${S3_SECRET_ID:${OSS_ACCESS_KEY:}}
        secret-key: ${S3_SECRET_KEY:${OSS_SECRET_KEY:}}
        region: ${S3_REGION}
        end-point: ${S3_ENDPOINT:${OSS_ENDPOINT:}}
        bucket-name: ${S3_BUCKET_NAME:${OSS_BUCKET:}}
        domain: ${S3_DOMAIN:${OSS_DOMAIN:${OSS_URL_PREFIX:}}}
        base-path: s3/

payment:
  base-url: ${PAYMENT_BASE_URL:${NEXT_PUBLIC_API_BASE_URL:http://localhost:8088/api}}
  alipay:
    app-id: ${ALIPAY_APP_ID:your_alipay_app_id}
    private-key: ${ALIPAY_PRIVATE_KEY:your_alipay_private_key}
    public-key: ${ALIPAY_PUBLIC_KEY:your_alipay_public_key}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:your_stripe_secret_key}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:your_stripe_publishable_key}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:your_stripe_webhook_secret}

yuagent:
  container:
    docker-host: ${YUAGENT_CONTAINER_DOCKER_HOST:unix:///var/run/docker.sock}
    user-volume-base-path: ${YUAGENT_CONTAINER_USER_VOLUME_PATH:/docker/users}
    default-mcp-gateway-image: ${YUAGENT_CONTAINER_DEFAULT_MCP_IMAGE:yuagent-mcp-gateway:latest}
    default-mcp-gateway-network-mode: ${YUAGENT_CONTAINER_DEFAULT_MCP_NETWORK:yuagent_yuagent-network}
    monitor-interval: ${YUAGENT_CONTAINER_MONITOR_INTERVAL:300000}
    stats-update-interval: ${YUAGENT_CONTAINER_STATS_INTERVAL:120000}

mcp:
  gateway:
    base-url: ${MCP_BASE_URL:${HIGH_AVAILABILITY_GATEWAY_URL:http://api-gateway:8081}}
    api-key: ${MCP_API_KEY:123456}
    connect-timeout: ${MCP_GATEWAY_CONNECT_TIMEOUT:60000}

tool:
  review:
    auto-approve: ${TOOL_REVIEW_AUTO_APPROVE:true}
